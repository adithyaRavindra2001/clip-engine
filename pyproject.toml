[project]
name = "clipengine"
version = "0.1.0"
description = "Local, mostly-automated short-form clipping engine: discover -> transcribe -> pick moments with Claude -> render 9:16 -> human review."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yt-dlp>=2025.1.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",  # 5.x dropped the Haar face detector
    "flask>=3.0",
    # Apple Silicon: fast Metal transcription. Everywhere else: faster-whisper.
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
clip = "clipengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipengine"]
